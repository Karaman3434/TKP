<!DOCTYPE html>
<!--

  Tablo Olarak Göster" artık burayı AÇAR (eskiden aynı sayfada aşağı
  açılıyordu). Üstte YILLIK TOPLAM ve AYLIK TOPLAM panoları (İş/Özel
  ayrımıyla), altında ay seçici + gerçek/düzenlenebilir tablo + Kaydet +
  Excel'e Aktar — hepsi eskisiyle aynı mantık, sadece kendi sayfasında.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json?v=WG.221026.0755.937">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png?v=WG.221026.0755.937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İş Takip">
<title>İş Takip — KM Kayıtları</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.151026.1455.828">
<!-- EKLENDİ (15.10.2026, Abdullah onayı) — "Beklet / Bekleyen İşlemler". -->
<link rel="stylesheet" href="bekleyen-islemler-style.css?v=WG.211026.2235.926">
<link rel="stylesheet" href="km-style.css?v=WG.031026.1900.722">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">İŞ TAKİP</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="km.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>
<div class="sayfa-rota-serit">
  <span class="sayfa-rota-serit-isim">📋 Kayıtlar</span>
  <span class="sayfa-rota-serit-rota">Araç KM</span>
</div>

<main class="sayfa kmk-sayfa">

  <div class="km-toplam-grup-baslik">YILLIK TOPLAM · <span id="kmYilEtiket">2026</span></div>
  <section class="km-toplam-satir">
    <div class="km-toplam-kutu km-toplam-kutu--is-dolu">
      <div class="km-toplam-kutu-etiket">İŞ KM</div>
      <div class="km-toplam-kutu-deger" id="kmYilToplamIs">0 km</div>
    </div>
    <div class="km-toplam-kutu km-toplam-kutu--ozel-dolu">
      <div class="km-toplam-kutu-etiket">ÖZEL KM</div>
      <div class="km-toplam-kutu-deger" id="kmYilToplamOzel">0 km</div>
    </div>
  </section>

  <div class="km-toplam-grup-baslik">AYLIK TOPLAM · <span id="kmAyEtiket">bu ay</span></div>
  <section class="km-toplam-satir">
    <div class="km-toplam-kutu km-toplam-kutu--is">
      <div class="km-toplam-kutu-etiket">İŞ KM</div>
      <div class="km-toplam-kutu-deger" id="kmAyToplamIs">0 km</div>
    </div>
    <div class="km-toplam-kutu km-toplam-kutu--ozel">
      <div class="km-toplam-kutu-etiket">ÖZEL KM</div>
      <div class="km-toplam-kutu-deger" id="kmAyToplamOzel">0 km</div>
    </div>
  </section>

  <select class="km-ay-secici" id="kmAySecici"></select>

  <div class="km-tablo-baslik-satir">
    <div class="km-tablo-baslik" id="kmTabloBaslik">Bu Ayın Kayıtları</div>
    <div class="km-tablo-baslik-butonlar">
      <button class="km-tablo-kaydet-buton" id="btnKmTabloKaydet">✓ Kaydet</button>
      <button class="excel-buton" id="btnExcel">📊 Excel'e Aktar</button>
    </div>
  </div>
  <!-- Bilgi şeridi + Toplamlar şeridi (25.09.2026) — Abdullah'ın elle
       biçimlendirdiği örnek Excel dosyasıyla BİREBİR: AD SOYAD/DÖNEM/PLAKA
       üstte, İş KM/Özel KM toplamı altta kırmızı "TOPLAMLAR" şeridinde. -->
  <div class="km-bilgi-serit" id="kmBilgiSerit">
    <div class="km-bilgi-hucre"><div class="km-bilgi-etiket">AD SOYAD</div><div class="km-bilgi-deger" id="kmBilgiAdSoyad">-</div></div>
    <div class="km-bilgi-hucre"><div class="km-bilgi-etiket">DÖNEM</div><div class="km-bilgi-deger" id="kmBilgiDonem">-</div></div>
    <div class="km-bilgi-hucre"><div class="km-bilgi-etiket">PLAKA</div><div class="km-bilgi-deger" id="kmBilgiPlaka">-</div></div>
  </div>
  <div class="data-table-container">
    <table class="data-table km-veri-tablo">
      <thead><tr>
        <th>Tarih</th><th>Saat</th><th>Güzergah</th><th>Ziyaret</th><th>Başlangıç KM</th><th>Bitiş KM</th><th>İş KM</th><th>Özel KM</th>
      </tr></thead>
      <tbody id="kmTabloGovde"></tbody>
    </table>
  </div>
  <div class="km-toplamlar-serit">
    <span class="km-toplamlar-etiket">TOPLAMLAR —</span>
    <span class="km-toplamlar-deger" id="kmToplamlarIs">İş KM: 0</span>
    <span class="km-toplamlar-deger" id="kmToplamlarOzel">Özel KM: 0</span>
  </div>

</main>

<!-- xlsx-js-style (25.09.2026): standart "xlsx" kütüphanesinin ÜCRETSİZ
     sürümü tarayıcıda hücre biçimlendirmesini (kenar/fill/font) YAZARKEN
     SESSİZCE YOK SAYIYOR — Excel'de hiç görünmemesinin sebebi buydu.
     xlsx-js-style aynı XLSX API'sini kullanır, tek fark stil yazma
     desteğinin gerçekten çalışması. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="km-kayitlar-render.js?v=WG.300926.1400.677"></script>

<script src="bekleyen-islemler.js?v=WG.221026.1245.949"></script>
</body>
</html>
