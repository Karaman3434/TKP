<script>
document.addEventListener("DOMContentLoaded", function(){
  var gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  var aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  var d = new Date();
  document.getElementById("gunTarihi").textContent = gunler[d.getDay()] + ", " + d.getDate() + " " + aylar[d.getMonth()] + " " + d.getFullYear();
  var btnMenuEl = document.getElementById("btnMenu");
  if(btnMenuEl) btnMenuEl.onclick = function(){ window.location.href = "menu.html"; };

  // BAKİYEDEKİ ÜRÜNLER sayacı (07.10.2026, Abdullah'ın isteğiyle).
  function bakiyeSayaciniGuncelle(){
    try{
      var n = ReportsData.bakiyedekiUrunler().length + ReportsData.stokBekleyenSiparisler().length; // stok bekleyen + bakiye (05.11.2026)
      var el = document.getElementById("bakiyeSayac");
      if(n>0){ el.textContent = n; el.hidden = false; } else { el.hidden = true; }
    }catch(e){}
  }
  ReportsData.arsivDegistiginde(bakiyeSayaciniGuncelle);
});
</script>
