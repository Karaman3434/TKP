<script>
document.addEventListener("DOMContentLoaded", function(){
  var gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  var aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  var d = new Date();
  document.getElementById("gunTarihi").textContent = gunler[d.getDay()] + ", " + d.getDate() + " " + aylar[d.getMonth()] + " " + d.getFullYear();
  document.getElementById("btnMenu").onclick = function(){ window.location.href = "menu.html"; };

  // AVANS TAKİBİ GÖSTERGESİ (24.09.2026) — kutucuk artık aynı zamanda
  // bir gösterge paneli: hangi ay açıksa o ayın İş/Özel avans
  // toplamlarını gösterir. Kapalı ayların listesi tam gelmeden
  // acikDonem() yanlış ay hesaplayabildiği için (bkz. avans-kayit-data.js),
  // ikisi de gelene kadar bekleyip öyle yazıyoruz.
  function avansTileGuncelle(){
    var el = document.getElementById("avansTileAlt");
    if(!el || typeof AvansKayitData === "undefined") return;
    if(!AvansKayitData.kayitlarYuklendiMi() || !AvansKayitData.taslakYuklendiMi()) return;
    var acik = AvansKayitData.acikDonem();
    var taslak = AvansKayitData.taslakOku(acik.ay, acik.yil);
    var isToplam = (taslak.isAvansiGirisleri||[]).reduce(function(s,x){ return s+(x.tutar||0); }, 0);
    var ozelToplam = (taslak.ozelAvansGirisleri||[]).reduce(function(s,x){ return s+(x.tutar||0); }, 0);
    el.textContent = aylar[acik.ay-1].slice(0,3).toUpperCase() + " · İş " + Math.round(isToplam).toLocaleString("tr-TR") + " · Özel " + Math.round(ozelToplam).toLocaleString("tr-TR");
  }
  AvansKayitData.degistiginde(avansTileGuncelle);
  avansTileGuncelle();
});
</script>
