<!DOCTYPE html>
<!--
  WEICON ASİST — GİRİŞ v2
  =========================
  Eski uygulamadaki e-posta/şifre giriş sistemiyle AYNI Firebase hesabını
  kullanır. Giriş yapınca Firebase oturumu tarayıcıda kalıcı olarak saklanır
  (firebase varsayılan davranışı) — yani her sayfada tekrar giriş istemez,
  sadece oturum süresi dolunca veya çıkış yapınca tekrar sorar.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEICON ASİST">
<title>WEICON ASİST — Giriş</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.151026.1455.828">
<link rel="stylesheet" href="login-style.css?v=WG.290926.1816.671">
</head>
<body>
<div class="sayfa-rota-serit">
  <span class="sayfa-rota-serit-isim">🔑 Giriş Yap</span>
</div>

<main class="giris-kutu">
  <div class="logo">WEICON</div>
  <h1>Giriş Yap</h1>

  <label for="girisEmail">E-posta / Kullanıcı Adı</label>
  <input type="text" id="girisEmail" autocomplete="username" autocapitalize="off">

  <label for="girisSifre">Şifre</label>
  <input type="password" id="girisSifre" autocomplete="current-password">

  <p class="giris-hata" id="girisHata" hidden></p>

  <button class="giris-buton" id="girisBtn">Giriş Yap</button>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=WG.011026.2340.706"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="auth.js?v=WG.051026.1055.730"></script>
<script src="login-render.js?v=WG.011026.2340.706"></script>
</body>
</html>
