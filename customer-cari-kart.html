<!DOCTYPE html>
<!-- WEICON ASİST V2 — VERSİYON: WG.151026.0905.824 — customer-cari-kart.html -->
<!--
  WEICON ASİST — CARİ KART v7
  ==============================
  Ana sayfa (main) TAMAMEN salt-görüntüleme: isim/şehir, TEMEL BİLGİLER
  (Vade/Fatura/Kargo, yan yana), sonra Fatura Adresi / Teslimat Adresi /
  Yetkili Bilgisi / Not blokları — her biri kendi renkli başlık satırında
  "Bilgiyi Güncelle" bağlantısına (ve silinebilir olanlarda küçük bir 🗑️
  butonuna) sahip; artık ayrı bir "Bilgiyi Düzenle" akordiyon ekranı yok
  (WG.090926.196). Blok başlığı ile içerik kutusu bitişik/kenarsız tek
  kutu gibi görünür (boşluk yok). Müşteri ADI şu an bilerek düzenlenebilir
  değil — uygulamada sipariş/rapor/görev/km kayıtları müşteri adını
  anahtar olarak kullanıyor, isim değişikliği bu bağlantıları koparabilir
  (ayrı, güvenli bir "yeniden adlandırma" özelliği gerekir).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEICON ASİST">
<title>WEICON ASİST — Cari Kart</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.071026.1205.742">
<link rel="stylesheet" href="customer-style.css?v=WG.151026.0905.824">
<link rel="stylesheet" href="detail-style.css?v=WG.091026.1010.753">
<link rel="stylesheet" href="cari-kart-style.css?v=WG.151026.0905.824">
<link rel="stylesheet" href="musteri-serit.css?v=WG.121026.2358.786">
<link rel="stylesheet" href="send-style.css?v=WG.021026.1245.709">
<!-- YENİ (06.10.2026, Abdullah'ın isteğiyle) — SADECE bu sayfada: iPad/tablet
     genişliğinde (>640px) içerik artık home.html'deki kuralla AYNI şekilde
     kenardan kenara — genel "body{max-width:640px}" burada geçersiz
     kılınıyor. Telefon genişliği HİÇ ETKİLENMİYOR. -->
<style>@media (min-width:641px){ body{ max-width:none !important; } } </style>
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="customer.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>

<div class="sayfa-rota-serit" id="rotaSeridi"></div>

<main class="sayfa">

  <div id="cariKartMusteriSeridi"></div>

  <!-- "TEMEL BİLGİLER" etiketi 06.10.2026'da Abdullah'ın isteğiyle kaldırıldı. -->
  <div class="ozet-satir-3 ozet-satir-3--birlesik ck-tiklanabilir-alan" data-bolum="cari">
    <div class="ozet-alan"><span class="ozet-ikon">📅</span><div class="ozet-metin"><div class="ozet-baslik">VADE</div><div class="ozet-deger" id="ozetVadeDeger">—</div></div></div>
    <div class="ozet-alan"><span class="ozet-ikon">📄</span><div class="ozet-metin"><div class="ozet-baslik">FATURA</div><div class="ozet-deger" id="ozetFaturaDeger">—</div></div></div>
    <div class="ozet-alan"><span class="ozet-ikon">🚚</span><div class="ozet-metin"><div class="ozet-baslik">KARGO</div><div class="ozet-deger" id="ozetKargoDeger">—</div></div></div>
  </div>

  <!-- FATURA ADRESLERİ -->
  <div class="ck-blok-etiket ck-blok-etiket--fatura">
    <span>🧾 FATURA ADRESİ</span>
    <span class="ck-kayit-rozet" id="faturaRozet" hidden></span>
  </div>
  <section class="ck-blok ck-tiklanabilir-alan" data-bolum="fatura">
    <div class="ck-kart-liste" id="faturaListesi"></div>
  </section>

  <!-- TESLİMAT ADRESLERİ -->
  <div class="ck-blok-etiket ck-blok-etiket--teslimat">
    <span>🚚 TESLİMAT ADRESİ</span>
    <span class="ck-kayit-rozet" id="teslimatRozet" hidden></span>
  </div>
  <section class="ck-blok ck-tiklanabilir-alan" data-bolum="teslimat">
    <div class="ck-kart-liste" id="teslimatListesi"></div>
  </section>

  <!-- YETKİLİ KİŞİLER -->
  <div class="ck-blok-etiket ck-blok-etiket--yetkili">
    <span>👤 YETKİLİ BİLGİSİ</span>
    <span class="ck-kayit-rozet" id="yetkiliRozet" hidden></span>
  </div>
  <section class="ck-blok ck-tiklanabilir-alan" data-bolum="yetkili">
    <div class="ck-kart-liste" id="yetkiliListesi"></div>
  </section>

  <!-- NOTLAR -->
  <div class="ck-blok-etiket ck-blok-etiket--not">
    <span>📝 NOT</span>
  </div>
  <section class="ck-blok ck-tiklanabilir-alan" data-bolum="not">
    <div class="ck-kart-liste" id="notListesi"></div>
  </section>

  <div class="ck-alt-buton-satir">
    <a class="cari-kapat-buton" id="cariKapatBtn" href="customer-hub.html">Kapat</a>
    <button class="cari-islemedevam-buton" id="btnIslemeDevam" hidden>📋 İŞLEMLER</button>
  </div>

  <!-- Bölüm eylem popup'ı (WG.100926.196): her bölümün içeriğine
       dokununca açılır — Bilgiyi Güncelle / Ekle / Sil / Kapat.
       Temel Bilgiler'de Ekle/Sil anlamsız olduğu için gizlenir. -->
  <div class="tip-secim-overlay" id="bolumEylemOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik" id="bolumEylemBaslik">Bilgi</div>
      <div class="bolum-eylem-grid">
        <button class="bolum-eylem-btn bolum-eylem-btn--guncelle" id="btnBolumGuncelle">✏️ Bilgiyi Güncelle</button>
        <button class="bolum-eylem-btn bolum-eylem-btn--ekle" id="btnBolumEkle">➕ Ekle</button>
        <button class="bolum-eylem-btn bolum-eylem-btn--sil" id="btnBolumSil">🗑️ Sil</button>
        <button class="bolum-eylem-btn bolum-eylem-btn--kapat" id="btnBolumEylemKapat">✕ Kapat</button>
      </div>
    </div>
  </div>

  <div class="tip-secim-overlay" id="tipSecimOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Ne için ürün arıyorsun?</div>
      <div class="tip-secim">
        <button class="tip-btn tip-btn--numune" data-tip="numune">NUMUNE</button>
        <button class="tip-btn tip-btn--teklif" data-tip="teklif">FİYAT<br>TEKLİFİ</button>
        <button class="tip-btn tip-btn--proforma" data-tip="proforma">PROFORMA<br>FATURA</button>
        <button class="tip-btn tip-btn--siparis" data-tip="siparis">SİPARİŞ</button>
      </div>
      <button class="tip-secim-vazgec-btn" id="btnTipSecimVazgec">Kapat</button>
    </div>
  </div>

  <!-- Açık Teklif Uyarısı (22.09.2026) — "SİPARİŞ" seçilince, aynı
       müşteride henüz siparişe dönüşmemiş bir teklif/proforma/numune
       varsa burada uyarır. Ürün eşleştirmesi yapmaz — sadece "açık bir
       şey var mı" kontrolü. -->
  <div class="tip-secim-overlay" id="acikBelgeUyariOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik" style="color:#7a5c00;">⚠ Bu müşteride açık bir belge var</div>
      <p class="ck-not-aciklama" id="acikBelgeUyariMetin" style="margin:0 0 10px;"></p>
      <div class="ck-sil-uyari-notu" id="acikBelgeUyariKayit" style="background:#fff;border-color:#e8c368;color:#333;font-weight:700;margin-bottom:12px;"></div>
      <button class="cari-islemedevam-buton" id="btnAcikBelgeKullan" style="width:100%;margin-bottom:8px;">📄 Bu belgeyi kullan</button>
      <button class="tip-secim-vazgec-btn" id="btnAcikBelgeYeniSiparis">Hayır, bambaşka bir sipariş oluşturuyorum</button>
    </div>
  </div>

</main>

<!-- "Hangisini düzenlemek/silmek istiyorsun?" seçici -->
<div class="overlay" id="pickerOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="pickerBaslik">Hangisi?</div>
    <div class="sheet-alt" id="pickerAlt"></div>
    <div id="pickerListesi"></div>
    <button class="sheet-secenek sheet-secenek--vazgec" data-kapat="pickerOverlay">Kapat</button>
  </div>
</div>

<!-- Ekle/Düzenle formu -->
<div class="overlay" id="formOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="formBaslik">Form</div>
    <div id="formIcerik"></div>
    <div class="sheet-buton-satir">
      <button class="btn-vazgec" data-kapat="formOverlay">Kapat</button>
      <button class="btn-kaydet" id="formKaydetBtn">✓ Kaydet</button>
    </div>
  </div>
</div>

<!-- Silme onayı -->
<div class="overlay" id="silOnayOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik">Silinsin mi?</div>
    <div class="sheet-alt" id="silOnayMetin"></div>
    <div class="sheet-buton-satir">
      <button class="btn-vazgec" data-kapat="silOnayOverlay">Kapat</button>
      <button class="btn-kaydet btn-kaydet--tehlike" id="silOnaylaBtn">🗑️ Evet, Sil</button>
    </div>
  </div>
</div>

<div class="toast" id="ckToast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=WG.011026.2340.706"></script>
<script src="auth.js?v=WG.051026.1055.730"></script>
<script src="ust-sabit-olcum.js?v=WG.060926.2105.156"></script>
<script src="customer-data.js?v=WG.300926.1130.675"></script>
<script src="musteri-serit.js?v=WG.121026.2358.786"></script>
<script src="reports-data.js?v=WG.131026.1455.798"></script>
<script src="reports-safety-fix.js?v=WG.020926.1338.87"></script>
<script src="vade-takip-data.js?v=WG.210926.2044.591"></script>
<script src="hata-log.js?v=WG.130926.2010.553"></script>
<script src="rota-takip.js?v=WG.150926.1300.573"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ RotaTakip.kaydet("customer-cari-kart.html", "🏢 Cari Bilgi"); RotaTakip.ciz("rotaSeridi"); });</script>
<script src="cari-kart-render.js?v=WG.121026.2340.785"></script>
</body>
</html>
