<!--
  WEICON ASİST — YENİ MÜŞTERİ EKLE v3
  ======================================

-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEICON ASİST">
<title>WEICON ASİST — Yeni Müşteri Ekle</title>

<!-- YENİ (15.10.2026, Abdullah'ın isteğiyle) — "Fotoğraf/Ekran Görüntüsünden
     Doldur" özelliği cari-kart-style.css'teki paylaşılan .overlay/.sheet/
     .sheet-secenek bileşenlerini kullanıyor (foto-doldur.js). -->
<link rel="stylesheet" href="cari-kart-style.css?v=WG.181026.2315.834">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="customer.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>
<div class="sayfa-rota-serit">
  <span class="sayfa-rota-serit-isim">➕ Yeni Müşteri</span>
  <span class="sayfa-rota-serit-rota">Müşteriler</span>
</div>

<main class="sayfa">

  <div class="yeni-musteri-baslik">YENİ MÜŞTERİ KAYDET</div>

  <section class="yeni-musteri-form">
    <button class="form-foto-doldur-btn" type="button" id="btnYeniMusteriFotoDoldur">📷 Fotoğraf/Ekran Görüntüsünden Doldur</button>
    <input type="text" id="yeniMusteriAdi" placeholder="Müşteri Adı *">
    <input type="text" id="yeniMusteriSehir" placeholder="Şehir">
    <input type="text" id="yeniMusteriAcikAdres" placeholder="📍 Açık Adres (varsa, opsiyonel)">
    <div class="form-satir-3">
      <input type="text" id="yeniMusteriVade" placeholder="Vade (gün) — örn. 45" inputmode="numeric" pattern="[0-9]*">
      <input type="text" id="yeniMusteriFatura" placeholder="Fatura">
      <input type="text" id="yeniMusteriKargo" placeholder="Kargo">
    </div>

    <div class="ic-kutu">
      <div class="ic-kutu-baslik">📞 İletişim Bilgileri</div>
      <div class="form-satir-2">
        <input type="tel" id="yeniMusteriTelefon" placeholder="Telefon">
        <input type="email" id="yeniMusteriEposta" placeholder="E-posta">
      </div>
    </div>
    <div class="yardim-notu">💡 Belirli bir kişi (isim) eklemek isterseniz, kaydettikten sonra müşteri kartından "Yetkili Kişi Ekle" ile ekleyebilirsiniz.</div>

    <div class="ic-kutu">
      <div class="ic-kutu-baslik">🚚 Teslimat Adresi (varsa, opsiyonel)</div>
      <textarea id="yeniMusteriTeslimatAdresi" placeholder="Teslimat adresi" rows="2"></textarea>
    </div>

    <button class="form-kaydet-btn form-kaydet-btn--buyuk" id="btnYeniMusteriKaydet">YENİ MÜŞTERİ BİLGİLERİNİ KAYDET</button>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="foto-doldur.js?v=WG.181026.2315.834"></script>
<script src="customer-add-render.js?v=WG.181026.2315.834"></script>

<script src="bekleyen-islemler.js?v=WG.151026.1455.828"></script>
</body>
</html>
