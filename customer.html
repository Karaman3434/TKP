  ====================================
  SADECE liste — arama + sıralama + müşteri satırları. Yeni müşteri ekleme
  ARTIK ayrı bir sayfa (customer-add.html). Bir müşteriye dokununca SADECE
  o müşterinin kartı açılır (customer-detail.html), başka hiçbir şey.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>WEICON ASİST — Müşteriler</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.071026.1205.742">

<!-- YENİ (06.10.2026, Abdullah'ın isteğiyle) — SADECE bu sayfada: iPad/tablet
     genişliğinde (>640px) içerik artık home.html'de zaten uygulanan kuralla
     AYNI şekilde kenardan kenara — home-style.css'teki genel
     "body{max-width:640px}" burada geçersiz kılınıyor. Telefon genişliği
     (≤640px) HİÇ ETKİLENMİYOR. Kanıt: body max-width kısıtlaması iPad 9'da
     (~820px) içeriği 640px'e sıkıştırıp kenarlarda ~90px boşluk bırakıyordu
     — mockup ile doğrulandı, Abdullah onayladı. -->
<style>@media (min-width:641px){ body{ max-width:none !important; } } </style>
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="home.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>
<div class="sayfa-rota-serit" id="rotaSeridi"></div>

<main class="sayfa">

  <!-- 04.10.2026 (Abdullah'ın isteğiyle): arama + şehir filtresi AYNI satırda
       (2/1 oranı). "Yeni Müşteri Ekle" kutusu kaldırıldı — açılır menü →
       Müşteri → Yeni Müşteri'de zaten var, burada tekrar göstermeye gerek yok. -->
  <div class="cm-altmenu-sarmalayici">
    <div class="musteri-arama-satiri">
      <div class="arama-kutusu">
        <input type="text" id="musteriAra" placeholder="Müşteri adı veya şehir ara..." autocomplete="off">
        <span class="arama-ikon">🔍</span>
      </div>
      <div class="musteri-sehir-filtre-kutu">
        <input type="text" id="musteriSehirFiltre" placeholder="Şehir / İlçe...">
      </div>
    </div>

    <!-- MÜŞTERİ HIZLI PENCERESİ (05.10.2026) — bir isme dokununca JS ile
         dolduruluyor ve gösteriliyor (bkz. customer-render.js
         hizliPencereyiAc). Arama satırının HEMEN ALTINDA, dar bir kutu. -->
    <div class="cm-altmenu" id="cmAltMenu" hidden>
      <div class="cm-altmenu-musteri-baslik" id="cmAltMenuBaslik"></div>
      <div id="cmAltMenuListe"></div>
    </div>
  </div>

  <p class="liste-bilgi-notu" id="listeBilgiNotu" hidden></p>

  <div id="musteriListesi"></div>
  <p class="bos-mesaj" id="musteriBosMesaj" hidden>Müşteri bulunamadı.</p>
  <p class="yukleniyor-mesaj" id="musteriYukleniyor">Müşteri listesi yükleniyor...</p>
  <button class="tum-musteriler-buton" id="btnTumMusteriler" hidden>👥 Tüm Müşterileri Göster</button>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="customer-render.js?v=WG.131026.1620.802"></script>
</body>
</html>
