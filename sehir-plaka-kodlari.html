<!DOCTYPE html>
<!--
  WEICON ASİST — ŞEHİR PLAKA KODLARI v1 (06.09.2026)
  Müşteri kodu üretiminde (M+il kodu+sıra no) kullanılan il-plaka eşleşme
  tablosunu görüntüler ve elle düzenlemeye izin verir. Kaynak:
  CustomerData.ilKodlariListele/ilKoduEkleGuncelle/ilKoduSil
  (customer-data.js — localStorage: weicon_il_kodlari).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">

<title>WEICON ASİST — Şehir Plaka Kodları</title>

<link rel="stylesheet" href="sehir-plaka-style.css?v=WG.011026.2210.702">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="menu.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>
<div class="sayfa-rota-serit">
  <span class="sayfa-rota-serit-isim">🏙️ Şehir Plaka Kodları</span>
  <span class="sayfa-rota-serit-rota">Menü</span>
</div>

<main class="sayfa">
  <p class="spk-aciklama">Müşteri kodu (M + il kodu + sıra no) bu tablodan üretilir. Bir ili değiştirmek veya silmek, sadece <b>bundan sonra kaydedilecek yeni müşterileri</b> etkiler — geçmiş kayıtlı kodlar değişmez.</p>

  <div class="arama-kutusu spk-arama">
    <input type="text" id="spkAra" placeholder="Şehir adıyla ara...">
    <span class="arama-ikon">🔍</span>
  </div>

  <section class="spk-ekle-kutu">
    <div class="spk-ekle-baslik">+ Yeni İl Ekle / Düzenle</div>
    <div class="spk-ekle-satir">
      <input type="text" id="spkYeniAd" placeholder="İl adı (örn. Samsun)">
      <input type="text" id="spkYeniKod" placeholder="Kod" maxlength="2" inputmode="numeric">
      <button id="btnSpkEkle">Kaydet</button>
    </div>
  </section>

  <div id="spkListesi"></div>
  <p class="bos-mesaj" id="spkBosMesaj" hidden>Aramanla eşleşen il bulunamadı.</p>

  <p class="surum-bilgisi" id="surumBilgisi"></p>
</main>
