<!DOCTYPE html>
<!--
  WEICON ASİST — SON İŞLEMLER (ayrı sayfa)
  ===========================================================

  düşüyordu). Artık "Kaçan İşlemler" ile aynı mantıkta ayrı bir sayfa.
  Liste tasarımı: ikon-avatar (Design B) — solda türü gösteren renkli
  harf rozeti, ortada müşteri+şehir+tarih tek satırda, sağda sadece
  REVİZE/KAÇTI varsa küçük etiket.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json?v=WG.221026.0755.937">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png?v=WG.221026.0755.937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İş Takip">
<title>İş Takip — Son İşlemler</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.151026.1455.828">

</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">İŞ TAKİP</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <!-- 21.10.2026 (Abdullah'ın isteğiyle): Geri artık Raporlar'a değil
       doğrudan Ana Sayfa'ya gidiyor — Son İşlemler'den açılan bir işlemde
       "Geri" zaten tarayıcı geçmişiyle (akilliGeriBagla, bkz. belge-
       render.js) buraya doğru döner; buradan ileri bir "Geri" ise artık
       Raporlar'ı hiç göstermeden Ana Sayfa'ya gider. -->
  <a class="nav-btn nav-btn--geri" href="home.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>
<div class="sayfa-rota-serit">
  <span class="sayfa-rota-serit-isim">🕐 Son İşlemler</span>
  <span class="sayfa-rota-serit-rota">Raporlar</span>
</div>

<main class="sayfa">

  <div class="islem-filtre-satiri">
    <input type="text" id="islemAra" placeholder="Müşteri adıyla ara..." autocomplete="off">
    <!-- 21.10.2026 (Abdullah onayı — mockup "B" tasarımı üzerinden): native
         <select> mobilde option arka planını yok saydığı için, "Tüm Türler"
         seçici kendi çizdiğimiz düğme+panel ile değiştirildi (bkz.
         son-islemler-style.css ".sif-tip-*" ve son-islemler-render.js
         tipFiltreKur()). Yapı, avans-takibi.html'deki "av-tip-btn/av-tip-
         popup/av-tip-secenek" kalıbıyla aynı mimari. -->
    <div class="sif-tip-wrap">
      <button type="button" id="islemTipBtn" class="sif-tip-btn">Tüm Türler<span class="sif-tip-ok">▾</span></button>
      <div class="sif-tip-popup" id="islemTipPopup" hidden>
        <button type="button" class="sif-tip-secenek sif-tip-secenek--tum" data-tip="">Tüm Türler<span class="sif-tip-check">✓</span></button>
        <button type="button" class="sif-tip-secenek sif-tip-secenek--numune" data-tip="numune">Numune</button>
        <button type="button" class="sif-tip-secenek sif-tip-secenek--teklif" data-tip="teklif">Teklif</button>
        <button type="button" class="sif-tip-secenek sif-tip-secenek--proforma" data-tip="proforma">Proforma</button>
        <button type="button" class="sif-tip-secenek sif-tip-secenek--siparis" data-tip="siparis">Sipariş</button>
        <button type="button" class="sif-tip-secenek sif-tip-secenek--beklemede" data-tip="beklemede">⏳ Beklemede</button>
      </div>
    </div>
    <div id="tarihFiltreYeri"></div>
  </div>
  <div class="si-liste-kutu">
    <div id="islemlerListesi"></div>
    <p class="bos-mesaj" id="islemlerBosMesaj" hidden>Henüz kayıt yok.</p>
  </div>

</main>
