  ===================================================================
  Önceden customer-detail.html içinde açılır bir bölümdü; artık kendi
  sayfası. "➕ Temas Gir" → tür seç (Ziyaret/Telefon/Mail/WhatsApp Msj) →
  not yaz → kaydet. Liste en yeni tarih en üstte, tür rozetli.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEICON ASİST">
<title>WEICON ASİST — Temas</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.151026.1455.828">
<!-- EKLENDİ (15.10.2026, Abdullah onayı) — "Beklet / Bekleyen İşlemler". -->
<link rel="stylesheet" href="bekleyen-islemler-style.css?v=WG.151026.1455.828">
<link rel="stylesheet" href="customer-style.css?v=WG.151026.1430.829">

<!-- YENİ (06.10.2026, Abdullah'ın isteğiyle) — SADECE bu sayfada: iPad/tablet
     genişliğinde (>640px) içerik artık home.html'deki kuralla AYNI şekilde
     kenardan kenara — genel "body{max-width:640px}" burada geçersiz
     kılınıyor. Telefon genişliği HİÇ ETKİLENMİYOR. -->
<style>@media (min-width:641px){ body{ max-width:none !important; } } </style>
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="customer-detail.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
</nav>
</div>

<div class="sayfa-rota-serit" id="rotaSeridi"></div>

<div class="islemler-musteri-serit">
  <div class="islemler-musteri-ad" id="temasMusteriAd">—</div>
</div>

<main class="sayfa">

  <button type="button" class="temas-gir-btn" id="btnTemasGir">➕ Temas Gir</button>
  <div id="detayZiyaretListesi"></div>
  <p class="bos-mesaj" id="detayZiyaretBos" hidden>Temas kaydı yok.</p>

  <a class="temas-kapat-buton" id="temasKapatBtn" href="customer-detail.html">Kapat</a>

  <div class="tip-secim-overlay" id="temasTurOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Temas Türü Seç</div>
      <div class="temas-tur-grid">
        <button class="temas-tur-btn temas-tur-btn--ziyaret" data-tur="ziyaret">📍 Ziyaret</button>
        <button class="temas-tur-btn temas-tur-btn--telefon" data-tur="telefon">📞 Telefon</button>
        <button class="temas-tur-btn temas-tur-btn--mail" data-tur="mail">✉️ Mail</button>
        <button class="temas-tur-btn temas-tur-btn--whatsapp" data-tur="whatsapp">💬 WhatsApp Msj</button>
      </div>
      <button class="tip-secim-vazgec-btn" id="btnTemasTurVazgec">Vazgeç</button>
    </div>
  </div>

  <div class="tip-secim-overlay" id="temasSilOnayOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Silinsin mi?</div>
      <p id="temasSilOnayMetin" style="text-align:center;font-size:14px;color:#44494f;margin:0 0 14px;"></p>
      <button id="btnTemasSilOnayla" style="background:#c0392b;color:#fff;border:none;border-radius:8px;padding:12px;min-height:44px;font-size:14px;font-weight:800;width:100%;margin-bottom:8px;cursor:pointer;">🗑️ Evet, Sil</button>
      <button class="tip-secim-vazgec-btn" id="btnTemasSilVazgec">Kapat</button>
    </div>
  </div>

  <div class="tip-secim-overlay" id="temasNotOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik" id="temasNotBaslik">Temas Notu</div>
      <textarea class="temas-not-input" id="temasNotInput" rows="4" placeholder="Not yaz... (örn. konuşulanlar, sonuç)"></textarea>
      <button class="temas-kaydet-btn" id="btnTemasKaydet">✓ Kaydet</button>
      <button class="tip-secim-vazgec-btn" id="btnTemasNotVazgec">Vazgeç</button>
    </div>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
