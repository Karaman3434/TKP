<body>

<!-- GUNCELLENDI (01.11.2026, Abdullah onayi - mockup onaylandi) - birlesik ust bar: Menu/Geri/Bekle/Kapat ikon grubu + sayfa etiketi/logo tek satirda. Eski ayri turuncu "sayfa-rota-serit" seridi kaldirildi, etiketi bu satira tasindi. -->
<div class="app-ust-sabit">
<div class="ub-bar">
  <div class="ub-grup">
    <button type="button" class="ub-btn ub-btn--menu" id="btnAsMenuAc" aria-label="Menüyü aç"><span class="ub-cizgiler" aria-hidden="true"><span></span><span></span><span></span></span></button>
    <a class="ub-btn ub-btn--geri" href="home.html" aria-label="Geri">‹</a>
    <button type="button" class="ub-btn ub-btn--bekle" id="btnUstBeklet" disabled aria-label="Beklet"><span class="ub-bekle-cizgiler"><span></span><span></span></span></button>
    <button type="button" class="ub-btn ub-btn--kapat" id="btnUstKapat" disabled aria-label="Kapat">✕</button>
  </div>
  <div class="ub-sayfa-etiket"><span>KM Takibi</span></div>
</div>
</div>
<!-- EKLENDİ (23.10.2026, "Menü her sayfada" — Abdullah'ın isteğiyle, mockup
     onaylandı: "Okey tamam kodlayalım") — çekmece menü artık SADECE Ana
     Sayfa'da değil, bu sayfada da var. İçerik (hangi satır kilitli/açık)
     sayfa yüklenirken DEĞİL, izinler Firebase'den çözüldükten SONRA
     menu-cekmece.js tarafından TEK bir yerden (MC_OGELER tablosu)
     dinamik oluşturulur — bkz. menu-cekmece.js. Yapı ve stil home.html
     ile BİREBİR aynı (home-anasayfa-style.css + menu-cekmece-style.css). -->
<div class="as-drawer-overlay" id="asDrawerOverlay" hidden>
  <div class="as-drawer" id="asDrawer">

    <div class="as-drawer-ustbar">
      <span class="as-drawer-logo">İŞ TAKİP</span>
      <button class="as-drawer-kapat" id="btnAsMenuKapat" aria-label="Menüyü kapat">✕</button>
    </div>

    <div class="as-drawer-profil">
      <div class="as-drawer-avatar" aria-hidden="true">👤</div>
      <div class="as-drawer-isim-blok">
        <div class="as-drawer-isim" id="asDrawerIsim">Hesabım</div>
        <div class="as-drawer-eposta" id="asDrawerEposta">…</div>
      </div>
    </div>

    <a class="as-drawer-anasayfa" id="asDrawerAnaSayfa" href="home.html">
      <span class="as-drawer-ikon" aria-hidden="true">🏠</span>
      <span class="as-drawer-etiket">Ana Sayfa</span>
      <span class="as-drawer-ok" aria-hidden="true">›</span>
    </a>

    <nav class="as-drawer-liste" id="asDrawerListe"></nav>

    <div class="as-drawer-versiyon" id="versiyonEtiketi">*** İŞ TAKİP WG.231026.1200.991 ***</div>

    <div class="as-drawer-ayarlar-blok">
      <a class="as-drawer-oge" href="menu.html"><span class="as-drawer-ikon" style="color:#5dade2;" aria-hidden="true">⚙️</span><span class="as-drawer-etiket">Ayarlar</span><span class="as-drawer-hata-rozet" id="asAyarlarHataRozeti" hidden>0</span></a>
    </div>

    <button class="as-drawer-cikis" id="btnAsCikis"><span aria-hidden="true">🚪</span>Çıkış Yap</button>
  </div>

  <div class="as-drawer-altmenu" id="asDrawerAltMenu" hidden>
    <div class="as-drawer-altmenu-baslik" id="asDrawerAltMenuBaslik"></div>
    <div class="as-drawer-altmenu-liste" id="asDrawerAltMenuListe"></div>
  </div>
</div>

<main class="sayfa">

  <!-- EN ÜST: dünün özet satırı (başlangıç → bitiş = mesafe) -->
  <div class="km-dun-ozet" id="kmDunOzet">Dünkü kayıt henüz yok.</div>

  <section class="km-form-kutu">
    <!-- AYLIK TOPLAM PANOSU (24.09.2026) — Abdullah'ın isteği: bu ayki
         İş/Özel KM toplamı, bugünün km girişi kutucuğunun EN ÜST
         satırında görünsün. -->
    <div class="km-toplam-grup-baslik" id="kmGunlukAyEtiketi">AYLIK TOPLAM</div>
    <section class="km-toplam-satir">
      <div class="km-toplam-kutu km-toplam-kutu--is">
        <div class="km-toplam-kutu-etiket">İŞ KM</div>
        <div class="km-toplam-kutu-deger" id="kmGunlukAyToplamIs">0 km</div>
      </div>
      <div class="km-toplam-kutu km-toplam-kutu--ozel">
        <div class="km-toplam-kutu-etiket">ÖZEL KM</div>
        <div class="km-toplam-kutu-deger" id="kmGunlukAyToplamOzel">0 km</div>
      </div>
    </section>

    <div class="hesap-alan">
      <label>Bugünün Kilometresi — <span id="kmBugunTarih"></span></label>
      <input type="number" id="kmBugun" placeholder="örn. 113340">
    </div>

    <div class="hesap-alan-grid">
      <div class="hesap-alan">
        <label>Saat</label>
        <input type="text" id="kmSaat" placeholder="örn. 09:00">
      </div>
      <div class="hesap-alan">
        <label>Tarih</label>
        <input type="text" id="kmTarihGoster" readonly>
      </div>
    </div>

    <div class="hesap-alan-grid">
      <div class="hesap-alan">
        <label>Seyir Güzergahı</label>
        <input type="text" id="kmGuzergah" placeholder="örn. Ankara - Kazan">
      </div>
      <div class="hesap-alan">
        <label>Ziyaret Edilen Yerler</label>
        <input type="text" id="kmZiyaretYerleri" placeholder="örn. Atlas Dry">
      </div>
    </div>

    <div class="kategori-secim">
      <button class="kategori-btn kategori-btn--secili" data-kategori="is">İş</button>
      <button class="kategori-btn" data-kategori="ozel">Özel</button>
    </div>

    <button class="km-kaydet-buton" id="btnKmKaydet">✓ Günü Kaydet</button>
  </section>

  <!-- HATIRLATMA NOTU (24.09.2026) — Abdullah'ın elle yazdığı serbest
       metin notu, "Bu Ayın Kayıtları" butonunun üstünde. -->
  <div class="km-hatirlatma-kutu" id="kmHatirlatmaKutu">
    <span class="km-hatirlatma-ikon">🗒️</span>
    <div class="km-hatirlatma-govde">
      <div class="km-hatirlatma-baslik">HATIRLATMA NOTU</div>
      <div class="km-hatirlatma-metin" id="kmHatirlatmaMetin">Dokun, bir not yaz.</div>
    </div>
    <span class="km-hatirlatma-ok">✎</span>
  </div>

  <a class="km-tablo-goster-buton" id="btnTabloGoster" href="km-kayitlar.html">📋 Bu Ayın Kayıtlarını Tablo Olarak Göster ›</a>

</main>

<!-- İLK KULLANIM: hiç KM kaydı yoksa başlangıç değeri iste -->
<div class="km-baslangic-overlay" id="kmBaslangicOverlay" hidden>
  <div class="km-baslangic-kutu">
    <div class="km-baslangic-baslik">🚗 Başlangıç Kilometresi Gerekli</div>
    <p class="km-baslangic-aciklama" id="kmBaslangicAciklama"></p>
    <input type="number" id="kmBaslangicInput" placeholder="örn. 42150" inputmode="decimal">
    <button class="km-baslangic-kaydet-btn" id="btnKmBaslangicKaydet">Kaydet ve Başla</button>
  </div>
</div>

<!-- HATIRLATMA NOTU popup — km-hatirlatma-kutu'ya dokununca açılır. -->
<div class="km-hatirlatma-overlay" id="kmHatirlatmaOverlay" hidden>
  <div class="km-hatirlatma-popup-kutu">
    <div class="km-hatirlatma-popup-baslik">🗒️ Hatırlatma Notu</div>
    <textarea id="kmHatirlatmaInput" placeholder="örn. 16-23 Eylül arası km bilgilerini merkeze gönderdim."></textarea>
    <div class="km-hatirlatma-popup-butonlar">
      <button class="km-hatirlatma-vazgec-btn" id="btnKmHatirlatmaVazgec">Vazgeç</button>
      <button class="km-hatirlatma-kaydet-btn" id="btnKmHatirlatmaKaydet">✓ Kaydet</button>
    </div>
  </div>
</div>
