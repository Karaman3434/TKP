<!DOCTYPE html>

<!--
  CİHAZ ONAYI (25.10.2026, Abdullah'ın isteğiyle — "izin vermeden
  bağlanamasın" talebi)
  ================================================================
  cihaz-engelli.html'in ikizi. Kısıtlı/çalışan bir hesap (özel link ile
  paylaşılan) daha önce hiç onaylanmamış bir cihazdan girmeye çalıştığında
  auth.js ÖNCE oturumu kapatır, SONRA buraya yönlendirir — burada da
  (cihaz-engelli.html gibi) tekrar giriş formu YOK, sadece bilgilendirme
  var. Abdullah "Cihazlar ve Kullanıcılar" panelindeki "⏳ Onay Bekleyen
  Cihazlar" bölümünden bu cihaza bir isim verip onaylayınca, kişi aynı
  linkle tekrar girince içeri alınır.

  ÖNEMLİ: Bu kontrol SADECE kısıtlı/çalışan hesapları etkiler — Abdullah'ın
  kendi admin hesabı bu sayfaya hiçbir zaman düşmez (bkz. auth.js'teki
  kisitliSayfaKontrolu notu).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json?v=TKP.09.11.26-23:35.1532">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İş Takip">
<title>İş Takip — Onay Bekliyor</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=TKP.01.11.26-22:45.1344">
<link rel="stylesheet" href="cihaz-engelli-style.css">
<link rel="stylesheet" href="cihaz-onay-bekliyor-style.css?v=WG.251026.0145.1014">
</head>
<body>
<div class="sayfa-rota-serit">
  <span class="sayfa-rota-serit-isim">⏳ Onay Bekliyor</span>
  <span class="sayfa-rota-serit-rota">Giriş</span>
</div>

<main class="engelli-kutu">
  <div class="logo">İŞ TAKİP</div>
  <div class="engelli-ikon" id="onayIkon">⏳</div>
  <h1 class="onay-bekliyor-baslik" id="onayBaslik">Onay Bekleniyor</h1>
  <div id="onayCihazAd" hidden style="display:inline-block;background:#eef2f7;color:#003a70;font-weight:900;font-size:14px;border-radius:10px;padding:8px 14px;margin:6px 0 10px"></div>
  <p id="onayMetin1">İsteğin yöneticiye gönderildi. Yönetici onayladığında aynı linkle tekrar giriş yapabilirsin.</p>
  <p id="onayMetin2" hidden></p>
</main>
<script>
/* 04.11.2026 (Abdullah onayı): cihaz adı + "Cihaz Sınırı Doldu" varyantı.
   auth.js yönlendirirken ?ad=...&sinir=1 gönderir; yoksa yerel ada bakılır. */
(function(){
  try{
    var q = new URLSearchParams(window.location.search);
    var ad = (q.get("ad") || "").trim();
    if(!ad){ try{ ad = (localStorage.getItem("weicon_cihaz_adi") || "").trim(); }catch(e){} }
    if(ad){
      var el = document.getElementById("onayCihazAd");
      el.textContent = "📱 " + ad;
      el.hidden = false;
    }
    if(q.get("sinir") === "1"){
      document.getElementById("onayIkon").textContent = "🚫";
      document.getElementById("onayBaslik").textContent = "Cihaz Sınırı Doldu";
      document.getElementById("onayMetin1").innerHTML = "Bu link ile en fazla <b>3 cihaz</b> tanımlı. Sınır dolu olduğu için bu cihazda program açılmaz.";
      var m2 = document.getElementById("onayMetin2");
      m2.textContent = "Yöneticinle iletişime geç.";
      m2.hidden = false;
    }
  }catch(e){}
})();
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=WG.271026.2238.1121"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="auth.js?v=TKP.11.11.26-14:20.1566"></script>
</body>
</html>
