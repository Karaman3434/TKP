name: İş Takip Sağlık Kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: istakip-health-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-health:
    name: Site, PWA ve temel dosya kontrolleri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JSON ve JavaScript kaynak kontrolleri
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          files = sorted(
              str(path.relative_to("."))
              for path in pathlib.Path(".").rglob("*.json")
              if ".git" not in path.parts
          )
          failed = False
          for name in files:
              try:
                  json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
                  print("OK JSON:", name)
              except Exception as exc:
                  print("FAIL JSON:", name, exc)
                  failed = True
          print(f"JSON dosyası sayısı: {len(files)}")
          if failed:
              sys.exit(1)
          manifest = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          version = str(manifest.get("_version") or "")
          if not version:
              print("FAIL: manifest.json _version alanı eksik")
              sys.exit(1)
          for name in ("home.html", "pin.html", "login.html", "pwa-tani.html"):
              html = pathlib.Path(name).read_text(encoding="utf-8")
              match = re.search(r'<link\s+rel="manifest"\s+href="manifest\.json\?v=([^"]+)"', html)
              if not match or match.group(1) != version:
                  print(f"FAIL: {name} manifest cache-buster _version ile eşleşmiyor")
                  sys.exit(1)
              print(f"OK manifest sürüm eşleşmesi: {name}")
          PY
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            echo "OK JS: $file"
          done

      - name: Temel güvenlik regresyon kontrolü
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          rules = json.loads(pathlib.Path("database.rules.json").read_text(encoding="utf-8"))["rules"]
          problems = []
          if rules.get(".read") is not False or rules.get(".write") is not False:
              problems.append("Firebase kök okuma/yazma varsayılanı false olmalı")
          device = rules.get("cihazlar", {}).get("$cihazId", {})
          pin_rules = rules.get("pin", {})
          if pin_rules.get(".read") == "auth != null":
              problems.append("Ortak PIN verisi tüm kimliği doğrulanmış kullanıcılara açık")
          if pin_rules.get(".write") == "auth != null":
              problems.append("Ortak PIN verisi tüm kimliği doğrulanmış kullanıcılarca değiştirilebilir")
          if "sonKullaniciUid" not in device.get(".read", ""):
              problems.append("Cihaz okuma kuralında sahiplik kontrolü eksik")
          if "sonKullaniciUid" not in device.get(".write", ""):
              problems.append("Cihaz yazma kuralında sahiplik kontrolü eksik")
          auth_source = pathlib.Path("auth.js").read_text(encoding="utf-8")
          onay_start = auth_source.find("function cihazOnayKontrolEt")
          onay_end = auth_source.find("// ---- CİHAZ ADI", onay_start)
          onay_logic = auth_source[onay_start:onay_end if onay_end >= 0 else None]
          if re.search(r"if\s*\(\s*String\(c\.ad", onay_logic):
              problems.append("Cihaz adıyla otomatik onay veriliyor; cihaz adı güvenilir kimlik değildir")
          if re.search(r"\.catch\(function\(\)\{\s*geriBildir\(true\);\s*\}\)", onay_logic):
              problems.append("Cihaz onay sorgusu hata verince erişim açılıyor")
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{30,}\b"),
          ]
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() in {
                  ".png", ".jpg", ".jpeg", ".webp", ".pdf", ".xlsx", ".zip", ".ico"
              }:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in secret_patterns:
                  if pattern.search(content):
                      problems.append(f"Olası gizli anahtar/token bulundu: {path}")
                      break
          if problems:
              print("GÜVENLİK KONTROLÜ BAŞARISIZ:")
              for problem in problems:
                  print("- " + problem)
              sys.exit(1)
          print("OK: kök Firebase kuralları kapalı, cihaz sahipliği denetleniyor, bilinen token kalıpları bulunmadı.")
          PY

      - name: Site sağlık kontrolü
        if: always()
        run: |
          python3 - <<'PY'
          import json, re, struct, sys, urllib.request, urllib.error

          BASE = "https://karaman3434.github.io/TKP/"
          failures = []
          warnings = []

          def fetch(path):
              url = BASE + path
              req = urllib.request.Request(url, headers={"User-Agent": "Istakip-HealthCheck/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = response.read()
                      if response.status != 200:
                          failures.append(f"{path}: HTTP {response.status}")
                      else:
                          print(f"OK HTTP {response.status}: {path} ({len(body)} bayt)")
                      return body
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  print(f"FAIL: {path}: {exc}")
                  return None

          home = fetch("home.html")
          pin = fetch("pin.html")
          pwa_tani = fetch("pwa-tani.html")
          manifest_bytes = fetch("manifest.json")
          sw = fetch("sw.js")
          icon192 = fetch("icon-192.png")
          icon512 = fetch("icon-512.png")

          manifest = None
          if manifest_bytes:
              try:
                  manifest = json.loads(manifest_bytes.decode("utf-8-sig"))
                  for field in ("name", "short_name", "start_url", "scope", "display", "icons"):
                      if not manifest.get(field):
                          failures.append(f"manifest.json: zorunlu/önemli alan eksik: {field}")
                  if manifest.get("display") not in ("standalone", "fullscreen", "minimal-ui"):
                      failures.append("manifest.json: display uygulama görünümüne uygun değil")
                  if not isinstance(manifest.get("icons"), list):
                      failures.append("manifest.json: icons listesi geçersiz")
                  else:
                      sizes = {item.get("sizes") for item in manifest["icons"] if isinstance(item, dict)}
                      if "192x192" not in sizes:
                          failures.append("manifest.json: 192x192 simge tanımı eksik")
                      if "512x512" not in sizes:
                          failures.append("manifest.json: 512x512 simge tanımı eksik")
              except Exception as exc:
                  failures.append(f"manifest.json: geçersiz JSON: {exc}")

          def check_png(data, path, expected):
              if not data:
                  return
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  failures.append(f"{path}: geçerli PNG değil")
                  return
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != expected:
                  failures.append(f"{path}: boyut {width}x{height}, beklenen {expected[0]}x{expected[1]}")
              else:
                  print(f"OK PNG: {path} {width}x{height}")

          check_png(icon192, "icon-192.png", (192, 192))
          check_png(icon512, "icon-512.png", (512, 512))

          if home:
              text = home.decode("utf-8", "replace")
              if 'rel="manifest"' not in text:
                  failures.append("home.html: manifest bağlantısı bulunamadı")
              if "auth.js" not in text:
                  warnings.append("home.html: auth.js referansı bulunamadı")
          if pin:
              text = pin.decode("utf-8", "replace")
              if 'rel="manifest"' not in text:
                  failures.append("pin.html: manifest bağlantısı bulunamadı")
              if "auth.js" not in text:
                  warnings.append("pin.html: auth.js referansı bulunamadı")
          if pwa_tani:
              text = pwa_tani.decode("utf-8", "replace")
              if 'rel="manifest"' not in text:
                  failures.append("pwa-tani.html: manifest bağlantısı bulunamadı")
              if "beforeinstallprompt" not in text:
                  warnings.append("pwa-tani.html: beforeinstallprompt tanı kontrolü bulunamadı")
          if sw:
              text = sw.decode("utf-8", "replace")
              if "addEventListener" not in text or "'fetch'" not in text and '"fetch"' not in text:
                  warnings.append("sw.js: beklenen fetch olay dinleyicisi bulunamadı")

          if manifest:
              for item in manifest.get("icons", []):
                  src = item.get("src", "") if isinstance(item, dict) else ""
                  if src:
                      path = src.split("?", 1)[0].lstrip("/")
                      if path.startswith("TKP/"):
                          path = path[4:]
                      if path not in ("icon-192.png", "icon-512.png"):
                          data = fetch(path)
                          if not data:
                              failures.append(f"Manifest simgesi erişilemiyor: {src}")
                          else:
                              size_match = re.fullmatch(r"(\d+)x(\d+)", str(item.get("sizes", "")))
                              if size_match:
                                  expected = tuple(int(value) for value in size_match.groups())
                                  check_png(data, path, expected)
                              else:
                                  warnings.append(f"Manifest simgesi için doğrulanabilir boyut tanımı yok: {src}")

          for warning in warnings:
              print("WARN: " + warning)
          if failures:
              print("\nSAĞLIK KONTROLÜ BAŞARISIZ:")
              for failure in failures:
                  print("- " + failure)
              sys.exit(1)
          print("\nSAĞLIK KONTROLÜ BAŞARILI: kontrol edilen site/PWA temel dosyaları erişilebilir.")
          PY
